databases:
  - name: entrega-marmitas-db
    plan: free
    databaseName: entrega_marmitas
    user: postgres

services:
  - type: web
    name: entrega-marmitas-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: entrega-marmitas-db
          property: connectionURI
      - key: DATABASE_USERNAME
        fromDatabase:
          name: entrega-marmitas-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: entrega-marmitas-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://entrega-marmitas.vercel.app
