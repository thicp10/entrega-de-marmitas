databases:
  - name: entrega-marmitas-db
    plan: free
    databaseName: entrega_marmitas
    user: marmitas_user

services:
  - type: web
    name: entrega-marmitas-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: entrega-marmitas-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: entrega-marmitas-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: entrega-marmitas-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: entrega-marmitas-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: entrega-marmitas-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://entrega-marmitas.vercel.app
